name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (incl. engine/catalog import boundary)
        run: pnpm lint

      - name: Test (unit + contract, incl. no-cost-leak)
        run: pnpm test

      - name: Assets check
        run: pnpm assets:check

      - name: Build configurator (public bundle)
        run: pnpm --filter configurator --if-present build

      - name: No cost/GP strings in public bundle
        run: pnpm check:no-cost-leak
